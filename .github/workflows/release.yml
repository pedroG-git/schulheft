name: Release

# Tag v* pushen (z. B. v0.1.0) → Windows-Installer bauen und als GitHub-Release veröffentlichen.
# Die Desktop-App sucht dort nach Updates (latest.yml); die Webseite verlinkt …/releases/latest/download/Schulheft-Setup.exe
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag passt zur Version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
